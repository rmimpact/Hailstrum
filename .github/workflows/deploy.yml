# Builds the site and deploys it to Firebase Hosting on every push to main.
#
# Set these up once in your GitHub repo (Settings → Secrets and variables → Actions):
#
#   Variables  (these are public config, not secrets — see SETUP.md step 4)
#     NEXT_PUBLIC_FIREBASE_API_KEY
#     NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#     NEXT_PUBLIC_FIREBASE_PROJECT_ID
#     NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#     NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#     NEXT_PUBLIC_FIREBASE_APP_ID
#     NEXT_PUBLIC_SITE_URL
#
#   Secret  (this one IS secret — it can deploy to your project)
#     FIREBASE_SERVICE_ACCOUNT
#       Firebase console → Project settings → Service accounts →
#       "Generate new private key". Paste the whole JSON file as the value.
#
# Shortcut: `npx firebase init hosting:github` creates the secret for you.

name: Deploy to Firebase Hosting

# Run manually only. Switch this to `push: branches: [main]` once the variables
# and the FIREBASE_SERVICE_ACCOUNT secret above are set, otherwise every push
# would kick off a build that can't authenticate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          channelId: live
